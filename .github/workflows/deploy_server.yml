name: Deploy to Server

on:
  # Запускается автоматически после успешного завершения основного воркфлоу билда
  workflow_run:
    workflows: ["Build docker image"] # Имя вашего основного файла сборки
    types:
      - completed
    branches: ["master"]
  # Позволяет запустить деплой вручную из вкладки Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Запускаем деплой только если билд прошел успешно (для workflow_run)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEQ_ADMIN_PASSWORD: ${{ secrets.SEQ_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SEQ_ADMIN_PASSWORD
          script: |
            # 1. Переходим в папку с проектом
            cd BimManagerPortal

            git pull

            # 2. Обновляем образы
            docker compose -f compose.prod.yaml pull

            # 3. Перезапускаем только изменившиеся контейнеры
            docker compose -f compose.prod.yaml up -d

            # 4. Чистим старые образы ("висячие" слои), чтобы не забивать диск сервера
            docker image prune -f