services:

  postgres:
    image: postgres:16-alpine
    container_name: bimmanagerportal-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgre_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgre_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgre_user} -d ${POSTGRES_DB:-postgre_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: bimmanagerportal-seq
    restart: always
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?SEQ_ADMIN_PASSWORD is required}
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_prod_data:/data

  api:
    image: bendylot/bimmanagerportal-api:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "5002:8080"
    depends_on:
      - postgres
      - seq
    
  web:
    image: bendylot/bimmanagerportal-web:latest
    container_name: bimmanagerportal-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_prod_data:
  seq_prod_data:
